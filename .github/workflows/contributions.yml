name: Update contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # daily, 07:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG
        env:
          # CONTRIB_TOKEN (optional PAT with read:user) also counts private contributions
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contributions.py "${{ github.repository_owner }}" asset/contributions.svg
      - name: Commit if changed
        run: |
          git diff --quiet asset/contributions.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update contribution graph"
          git push
